version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_story_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Backend API
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Server Configuration
      PORT: 3001
      NODE_ENV: production
      FRONTEND_URL: http://frontend
      
      # Database Configuration
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_story_app
      DB_POOL_MAX: 10
      DB_IDLE_TIMEOUT: 30000
      DB_CONNECTION_TIMEOUT: 2000
      
      # Redis Configuration
      REDIS_URL: redis://redis:6379
      
      # JWT Configuration (change in production)
      JWT_SECRET: docker-jwt-secret-key-change-in-production
      JWT_EXPIRES_IN: 7d
      
      # Logging Configuration
      LOG_LEVEL: info
      
      # Rate Limiting
      API_RATE_LIMIT_WINDOW_MS: 900000
      API_RATE_LIMIT_MAX_REQUESTS: 100
      
      # File Upload Configuration
      UPLOAD_DIR: ./uploads
      MAX_FILE_SIZE: 10485760
      
      # Session Configuration
      SESSION_SECRET: docker-session-secret-key
      SESSION_MAX_AGE: 86400000
      
      # Encryption Keys (for API key storage)
      ENCRYPTION_KEY: docker-32-character-encryption-key
      
      # Feature Flags
      ENABLE_REGISTRATION: true
      ENABLE_EXPORT: true
      ENABLE_COLLABORATION: false
      
      # Performance Settings
      GENERATION_TIMEOUT_MS: 7200000
      EXPORT_TIMEOUT_MS: 300000
      MAX_CONCURRENT_GENERATIONS: 5
    volumes:
      - backend_uploads:/app/uploads
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  backend_uploads:

networks:
  default:
    name: ai-story-app